global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # DashyBoard API metrics
  - job_name: "dashyboard-api"
    scrape_interval: 10s
    static_configs:
      - targets: ["dashyboard-api:8080"]
    metrics_path: /metrics

  # Docker container metrics (via cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Node exporter for host metrics (optional)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
